<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme-aware favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <!-- Fallback for browsers that don't support media queries on link -->
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thynkr - AI-Powered Study Platform | Transform your learning with intelligent study tools, AI tutoring, and personalized learning paths" />
    <meta name="keywords" content="AI study platform, online learning, AI tutor, flashcards, study notes, quiz generator, educational technology" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thynkr - AI-Powered Study Platform" />
    <meta property="og:description" content="Transform your learning with intelligent study tools, AI tutoring, and personalized learning paths" />
    <meta property="og:site_name" content="Thynkr" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thynkr - AI-Powered Study Platform" />
    <meta name="twitter:description" content="Transform your learning with intelligent study tools and AI tutoring" />
    
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Optimized font loading - only Inter with needed weights, display=swap for fast first paint -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Thynkr - AI-Powered Study Platform</title>
    <!-- Lottie - loaded async to not block rendering -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.3/dist/lottie-player.js" async></script>
  </head>
  <body>
    <script>
      // Early theme application to prevent flicker and ensure override works before React mounts
      (function () {
        try {
          var mode = localStorage.getItem('themeMode');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (!mode || mode === 'system') ? (systemDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          var body = document.body;
          root.classList.remove('light', 'dark');
          body && body.classList.remove('light', 'dark');
          if (theme === 'dark') {
            root.classList.add('dark');
            body && body.classList.add('dark');
          } else {
            root.classList.add('light');
            body && body.classList.add('light');
          }
        } catch (e) {
          // noop
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
