<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Gradient background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle pattern overlay -->
  <g opacity="0.08">
    <circle cx="100" cy="100" r="200" fill="white"/>
    <circle cx="1100" cy="530" r="250" fill="white"/>
    <circle cx="600" cy="0" r="150" fill="white"/>
  </g>
  
  <!-- Glass card -->
  <rect x="80" y="120" width="1040" height="390" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Brain icon circle -->
  <circle cx="200" cy="315" r="70" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="64" fill="white" text-anchor="middle">🧠</text>
  
  <!-- Text content -->
  <text x="320" y="280" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">
    Thynkr
  </text>
  <text x="320" y="340" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.85)">
    AI-Powered Study Platform
  </text>
  
  <!-- Feature pills -->
  <rect x="320" y="370" width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="390" y="394" font-family="'Inter', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-weight="600">📝 Summaries</text>
  
  <rect x="480" y="370" width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="550" y="394" font-family="'Inter', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-weight="600">🃏 Flashcards</text>
  
  <rect x="640" y="370" width="120" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="700" y="394" font-family="'Inter', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-weight="600">❓ Quizzes</text>
  
  <rect x="780" y="370" width="110" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="835" y="394" font-family="'Inter', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-weight="600">📖 Notes</text>
  
  <!-- URL at bottom -->
  <text x="600" y="580" font-family="'Inter', Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="500">
    thynkr.study
  </text>
</svg>
