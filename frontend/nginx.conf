# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name thynkr.ca www.thynkr.ca;
    return 301 https://thynkr.ca$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name thynkr.ca www.thynkr.ca;
    root /usr/share/nginx/html;
    index index.html;

    if ($host = www.thynkr.ca) {
        return 301 https://thynkr.ca$request_uri;
    }

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Increase max upload size for files (50MB)
    client_max_body_size 50M;

    # Serve uploaded files from backend
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE endpoint - special configuration for Server-Sent Events
    location /api/admin/metrics/live {
        proxy_pass http://backend:3001/api/admin/metrics/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        
        # SSE-specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        keepalive_timeout 86400s;
        
        # Chunked transfer encoding
        chunked_transfer_encoding on;
    }

    # API reverse proxy to backend service on the Docker network
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Social media bot detection — serve pre-rendered OG meta tags
    set $is_bot 0;
    if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|TelegramBot|WhatsApp|Discordbot|Googlebot|bingbot|Applebot|Pinterest|redditbot)") {
        set $is_bot 1;
    }

    # SPA routing (must come last to avoid catching /uploads and /api)
    location / {
        if ($is_bot = 1) {
            rewrite ^(.*)$ /og$1 break;
            proxy_pass http://backend:3001;
        }
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
