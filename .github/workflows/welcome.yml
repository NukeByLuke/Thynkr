name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome new contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue in Thynkr! 
            
            We appreciate you taking the time to contribute. A maintainer will review your issue soon.
            
            In the meantime:
            - Make sure you've provided all the requested information
            - Check our [Contributing Guide](../CONTRIBUTING.md) for guidelines
            - Join our [Discussions](https://github.com/luked177/Thynkr/discussions) for questions
          pr-message: |
            🎉 Thanks for opening your first pull request in Thynkr! 
            
            We're excited to review your contribution. Here's what happens next:
            
            1. Automated checks will run on your PR
            2. A maintainer will review your changes
            3. We may request some changes
            
            Please make sure:
            - [ ] Your PR follows our [Contributing Guide](../CONTRIBUTING.md)
            - [ ] All tests pass
            - [ ] You've updated documentation if needed
            
            Thanks for contributing to making Thynkr better! 🚀
