name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # DEPENDABOT PRs: Simple check that always passes
  # ============================================================
  dependabot-check:
    name: "Dependabot Check"
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        continue-on-error: true

      - name: Mark as safe to merge
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "SAFE TO MERGE" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # REGULAR PRs: Full lint and test suite
  # ============================================================
  lint-and-test:
    name: "Lint & Test"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thynkr
          POSTGRES_PASSWORD: thynkr_test
          POSTGRES_DB: thynkr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect test suites
        id: detect-tests
        shell: bash
        run: |
          if find backend -type f \( -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.ts" -o -name "*.spec.tsx" -o -name "*.test.js" -o -name "*.spec.js" \) | grep -q .; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if find frontend -type f \( -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.ts" -o -name "*.spec.tsx" -o -name "*.test.js" -o -name "*.spec.js" \) | grep -q .; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint backend
        run: pnpm --filter backend lint

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Generate Prisma Client
        run: pnpm --filter backend db:generate

      - name: Run backend tests
        if: steps.detect-tests.outputs.backend == 'true'
        run: pnpm --filter backend test
        env:
          DATABASE_URL: postgresql://thynkr:thynkr_test@localhost:5432/thynkr_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          STRIPE_SECRET_KEY: sk_test_fake
          NODE_ENV: test

      - name: Skip backend tests (none found)
        if: steps.detect-tests.outputs.backend != 'true'
        run: echo "No backend test files found. Skipping backend test run."

      - name: Run frontend tests
        if: steps.detect-tests.outputs.frontend == 'true'
        run: pnpm --filter frontend test

      - name: Skip frontend tests (none found)
        if: steps.detect-tests.outputs.frontend != 'true'
        run: echo "No frontend test files found. Skipping frontend test run."

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_URL: http://localhost:3001/api

  # ============================================================
  # E2E Tests (only for regular PRs, not Dependabot)
  # ============================================================
  e2e:
    name: "E2E Tests"
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.actor != 'dependabot[bot]'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thynkr
          POSTGRES_PASSWORD: thynkr_test
          POSTGRES_DB: thynkr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect E2E tests
        id: detect-e2e
        shell: bash
        run: |
          if find frontend -type f \( -name "*.e2e.ts" -o -name "*.e2e.tsx" -o -name "*.e2e.js" -o -name "*.spec.e2e.ts" -o -name "*.spec.e2e.tsx" -o -path "*/e2e/*.ts" -o -path "*/e2e/*.tsx" -o -path "*/e2e/*.js" \) | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Browsers
        if: steps.detect-e2e.outputs.exists == 'true'
        run: pnpm --filter frontend exec playwright install --with-deps

      - name: Generate Prisma Client
        if: steps.detect-e2e.outputs.exists == 'true'
        run: pnpm --filter backend db:generate

      - name: Run migrations
        if: steps.detect-e2e.outputs.exists == 'true'
        run: pnpm --filter backend db:migrate
        env:
          DATABASE_URL: postgresql://thynkr:thynkr_test@localhost:5432/thynkr_test

      - name: Seed database
        if: steps.detect-e2e.outputs.exists == 'true'
        run: pnpm --filter backend db:seed
        env:
          DATABASE_URL: postgresql://thynkr:thynkr_test@localhost:5432/thynkr_test

      - name: Run E2E tests
        if: steps.detect-e2e.outputs.exists == 'true'
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://thynkr:thynkr_test@localhost:5432/thynkr_test
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          STRIPE_SECRET_KEY: sk_test_fake
          VITE_API_URL: http://localhost:3001/api

      - name: Skip E2E tests (none found)
        if: steps.detect-e2e.outputs.exists != 'true'
        run: echo "No E2E test files found. Skipping E2E test run."

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always() && steps.detect-e2e.outputs.exists == 'true'
        with:
          name: playwright-report
          path: frontend/playwright-report/
